name: Publish alpha (develop)

# Publishes the fork's own packages from `develop` to npm under the `dev` dist
# tag, at whatever version `develop` currently declares.
#
# Three triggers, on purpose:
#
#   push      immediate publish when a merge lands normally.
#   schedule  a reconciler. The push trigger alone is NOT reliable here: a merge
#             performed by GitHub auto-merge that was enabled with GITHUB_TOKEN
#             may raise no event that starts a workflow. Without this, exactly the
#             automated merges we care about would silently never publish.
#   dispatch  manual, and for dry runs.
#
# The job is idempotent: a package whose exact version is already on npm is
# skipped. So re-running is always safe, and the reconciler is a no-op once a
# push-triggered run has done the work.

on:
  push:
    branches: [develop]
    paths:
      - 'packages/*/package.json'
      - '.github/workflows/publish-alpha.yml'
  schedule:
    # 05:40 UTC — an hour after the sync workflow, so an overnight merge is picked
    # up even when its push raised no event.
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be published, but publish nothing
        type: boolean
        default: true

concurrency:
  group: publish-alpha
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.repository == 'Mermaid-Chart/alana-mermaid'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for short-lived
      # credentials, so no NPM_TOKEN is stored. Each package needs a trusted
      # publisher configured on npm, pointing at this repository and this file.
      id-token: write
    env:
      DIST_TAG: dev
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          cache: pnpm
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'

      - name: Work out what needs publishing
        id: plan
        run: |
          set -euo pipefail
          # The publishable set is defined once, in version.mjs.
          PLAN='[]'
          while read -r name version dir; do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip    ${name}@${version} — already on npm"
            else
              echo "publish ${name}@${version}"
              PLAN="$(jq -c --arg n "$name" --arg v "$version" --arg d "$dir" \
                '. + [{name:$n, version:$v, dir:$d}]' <<<"$PLAN")"
            fi
          done < <(node .github/fork-sync/version.mjs --list-publishable |
                     jq -r '.[] | "\(.name) \(.version) \(.dir)"')

          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          COUNT="$(jq 'length' <<<"$PLAN")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "${COUNT} package(s) to publish." >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- `\(.name)@\(.version)`"' <<<"$PLAN" >> "$GITHUB_STEP_SUMMARY"

      - name: Guard against publishing a non-alpha from develop
        if: steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          # develop carries the alpha line. A `-b.N` version here means the
          # release lines have been crossed, and publishing it under `dev` would
          # confuse the beta channel that `main` owns.
          BAD="$(jq -r '.[] | select(.version | test("-a\\.[0-9]+$") | not) | "\(.name)@\(.version)"' \
            <<<'${{ steps.plan.outputs.plan }}')"
          if [ -n "$BAD" ]; then
            echo "::error title=Not an alpha version::develop publishes the -a.N alpha line, but these are not alpha versions:"
            printf '%s\n' "$BAD"
            exit 1
          fi

      - name: Install and build
        if: steps.plan.outputs.count != '0'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Publish
        if: steps.plan.outputs.count != '0' && env.DRY_RUN != 'true'
        env:
          # Attaches a provenance attestation using the OIDC token above.
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          # Trusted publishing needs a recent npm; upstream's release.yml does the
          # same thing for the same reason.
          npm install -g npm@11

          echo '${{ steps.plan.outputs.plan }}' | jq -c '.[]' | while read -r entry; do
            dir="$(jq -r '.dir' <<<"$entry")"
            name="$(jq -r '.name' <<<"$entry")"
            version="$(jq -r '.version' <<<"$entry")"
            echo "::group::publishing ${name}@${version}"
            # --tag dev is load-bearing. `npm publish` moves `latest` regardless
            # of semver ordering, and an alpha sorts BELOW the beta of the same
            # base (prerelease ids compare alphabetically, so a < b). Publishing
            # untagged would make an alpha the default install ahead of the beta
            # that `main` publishes.
            ( cd "$dir" && npm publish --tag "$DIST_TAG" --access public )
            echo "::endgroup::"
          done

      - name: Dry-run notice
        if: steps.plan.outputs.count != '0' && env.DRY_RUN == 'true'
        run: echo "::notice title=Dry run::Nothing was published. Re-run with dry_run=false to publish."

      - name: Confirm the dist tags
        if: steps.plan.outputs.count != '0' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          {
            echo
            echo '### Dist tags after publishing'
            echo
            echo '| package | dev | latest |'
            echo '|---|---|---|'
            echo '${{ steps.plan.outputs.plan }}' | jq -r '.[].name' | while read -r name; do
              tags="$(npm view "$name" dist-tags --json 2>/dev/null || echo '{}')"
              printf '| `%s` | %s | %s |\n' "$name" \
                "$(jq -r '.dev // "—"' <<<"$tags")" \
                "$(jq -r '.latest // "—"' <<<"$tags")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
